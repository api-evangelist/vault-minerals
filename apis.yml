name: Vault Minerals

description: Vault Minerals is a Perth, Western Australia-based intermediate gold producer. Its own site says the company is a financially disciplined, returns-focused gold business anchored by a long-life asset in the Leonora district. It runs the Leonora Operations, the Mount Monger Gold Operations near Kalgoorlie and the Deflector Gold-Copper Operations in the Midwest Region of Western Australia, along with the Sugar Zone Gold Project in Ontario, Canada. The site publishes investor announcements, presentations, reports and Genesis Scheme of Arrangement information. It does not publish a developer portal, API documentation or a public API.

